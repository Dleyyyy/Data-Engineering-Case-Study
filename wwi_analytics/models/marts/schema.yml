version: 2

models:
  - name: dim_customer
    columns:
      - name: customer_key
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null

  - name: fact_sale
    columns:
      - name: invoice_line_key
        tests:
          - unique
          - not_null
      - name: customer_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_key
      - name: salesperson_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_employee')
              field: employee_key